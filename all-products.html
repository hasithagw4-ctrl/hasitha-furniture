<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products | Hasitha Furniture & Electronics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
        tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#faf6f1',
              100: '#f0e8dc',
              200: '#e0d0bc',
              300: '#c9b090',
              400: '#a88b5c',
              500: '#8b6b3d',
              600: '#6f5430',
              700: '#574226',
              800: '#483720',
              900: '#3D2914',
              950: '#21160b'
            },
            beige: {
              50: '#faf8f5',
              100: '#F3EBE0',
              200: '#e8ddd0',
              300: '#d9c9b5',
              400: '#c4a97e',
              500: '#b8956a'
            }
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>body{font-family:Inter,sans-serif}.font-display{font-family:'Playfair Display',serif}
    /* Lining numbers — same size as letters (Playfair old-style nums fix) */
    .font-display,
    .product-card-sm .meta h3,
    .product-card-feat .meta h3 {
      font-variant-numeric: lining-nums;
      font-feature-settings: "lnum" 1;
    }

  </style>
</head>
<body class="bg-beige-50 text-gray-800">

  <nav class="bg-primary-900 text-white sticky top-0 z-50 shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-beige-300 flex items-center justify-center text-primary-900 font-display font-bold">H</div>
        <span class="font-display text-lg">Hasitha Furniture</span>
      </a>
      <a href="/" class="text-sm text-beige-200 hover:text-white">← Back to Home</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center mb-8">
      <p class="text-primary-700 text-sm tracking-[0.25em] uppercase mb-2">Full Collection</p>
      <h1 class="font-display text-3xl md:text-5xl text-primary-900">All Products</h1>
      <div class="w-20 h-1 bg-primary-700 mx-auto mt-4"></div>
    </div>

    <div class="max-w-xl mx-auto mb-12">
      <div class="relative">
        <input type="text" id="search" placeholder="Search all products..."
               class="w-full px-5 py-3 pl-12 rounded-full border border-primary-200 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white shadow-sm text-sm"
               oninput="doSearch(this.value)">
        <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <div id="content">
      <p class="text-center text-gray-500 py-10">Loading products...</p>
    </div>
  </main>

  <footer class="bg-primary-950 text-beige-300 py-8 mt-12 text-center text-sm">
    <a href="/" class="hover:text-white">Hasitha Furniture & Electronics</a> · Ragalkanda, Alawwa
  </footer>

  <script>
    var allProducts = [];

    function productCategories(p) {
      if (!p) return [];
      if (Array.isArray(p.categories) && p.categories.length) return p.categories.filter(Boolean);
      if (Array.isArray(p.category) && p.category.length) return p.category.filter(Boolean);
      if (p.category) return [p.category];
      return [];
    }
    function inCategory(p, cat) {
      if (!cat) return true;
      var c = String(cat).toLowerCase();
      return productCategories(p).some(function(x) { return String(x).toLowerCase() === c; });
    }
    function categoryLabel(p) {
      return productCategories(p).join(' · ');
    }
;

    var groups = [
      {
        title: 'Furniture',
        cats: ['Sofas','Beds','Wardrobes','Dressing Tables','Dining Tables','Dining Chairs','Dining Sets','Veranda Chairs','Office Furniture','Mattresses','Wall Units','Coffee Tables','TV Stands','Display Cupboards','Shoe Racks','Drawer Cupboards','Desks','Study','Laundry','Baby Items','Bathroom','Other Furniture','Plastic Items','Gift Items']
      },
      {
        title: 'Living Room',
        cats: ['Living Room']
      },
      {
        title: 'Bedroom',
        cats: ['Bedroom']
      },
      {
        title: 'Kitchen',
        cats: ['Kitchen']
      },
      {
        title: 'Electronics',
        cats: ['Televisions','Refrigerators','Washing Machines','Ovens','Blenders','Kettles & Irons','Pressure Washers','Fans','Vacuum Cleaners','Rice Cookers','Party Boxes','Sound Systems & Radios','Lights & Bulbs','Other Electronics']
      }
    ];

    function cardHtml(p) {
      var img = p.image
        ? '<img src="' + p.image + '" alt="' + (p.name||'') + '" class="w-full h-full object-cover">'
        : '<span class="text-3xl sm:text-5xl opacity-40">📦</span>';
      var disc = p.discount
        ? '<span class="text-[10px] sm:text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded-full">' + p.discount + '</span>'
        : '';
      return '<a href="/product.html?id=' + p._i + '" class="bg-white rounded-xl sm:rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition block">' +
        '<div class="aspect-square bg-beige-100 overflow-hidden">' + img + '</div>' +
        '<div class="p-2.5 sm:p-4">' +
          '<h3 class="font-display text-sm sm:text-lg text-primary-900 mb-1 line-clamp-2 leading-snug">' + (p.name||'') + '</h3>' +
          '<p class="font-semibold text-primary-800 text-sm sm:text-base">' + (p.price||'Price on request') + '</p>' +
          (disc ? '<div class="mt-1">' + disc + '</div>' : '') +
        '</div></a>';
    }

    function render(list) {
      var html = '';
      var any = false;
      groups.forEach(function(g) {
        var items = list.filter(function(p) {
          return g.cats.some(function(c) {
            return inCategory(p, c);
          });
        });
        if (!items.length) return;
        any = true;
        html += '<section class="mb-14">' +
          '<h2 class="font-display text-2xl md:text-3xl text-primary-900 mb-6">' + g.title + '</h2>' +
          '<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5 md:gap-6">' +
          items.map(cardHtml).join('') +
          '</div></section>';
      });
      // orphan categories not in groups
      var known = {};
      groups.forEach(function(g){ g.cats.forEach(function(c){ known[c.toLowerCase()] = true; }); });
      var others = list.filter(function(p){
          var cats = productCategories(p);
          if (!cats.length) return true;
          return !cats.some(function(c){ return known[String(c).toLowerCase()]; });
        });
      if (others.length) {
        any = true;
        html += '<section class="mb-14">' +
          '<h2 class="font-display text-2xl md:text-3xl text-primary-900 mb-6">Other</h2>' +
          '<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5 md:gap-6">' +
          others.map(cardHtml).join('') +
          '</div></section>';
      }
      document.getElementById('content').innerHTML = any
        ? html
        : '<p class="text-center text-gray-500 py-10">No products found.</p>';
    }

    function doSearch(q) {
      var query = (q||'').toLowerCase().trim();
      if (!query) { render(allProducts); return; }
      render(allProducts.filter(function(p) {
        return (p.name||'').toLowerCase().indexOf(query) !== -1 ||
               (p.description||'').toLowerCase().indexOf(query) !== -1 ||
               productCategories(p).join(' ').toLowerCase().indexOf(query) !== -1;
      }));
    }

    async function load() {
      try {
        var res = await fetch('/data/products.json');
        var data = await res.json();
        allProducts = (data.products || []).filter(function(p){ return p.visible !== false && p.visible !== "false" && p.visible !== "No"; }).map(function(p, i) {
          return Object.assign({}, p, { _i: i });
        });
        render(allProducts);
      } catch (e) {
        document.getElementById('content').innerHTML =
          '<p class="text-center text-gray-500 py-10">Could not load products.</p>';
      }
    }
    load();
  </script>
</body>
</html>
