<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products | Hasitha Furniture & Electronics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50:'#f0f7f4',100:'#dceee6',200:'#bbddd0',300:'#8cc5b0',400:'#5aa68c',
              500:'#3a8a70',600:'#2b6f5a',700:'#245a4a',800:'#1f483c',900:'#0B3D2E',950:'#072920'
            },
            beige: {50:'#faf8f5',100:'#f5f0e6',200:'#ebe0d0',300:'#E8D9C0',400:'#d4c0a0',500:'#c4a97e'}
          },
          fontFamily: { display: ['Playfair Display','serif'], sans: ['Inter','sans-serif'] }
        }
      }
    }
  </script>
  <style>body{font-family:Inter,sans-serif}.font-display{font-family:'Playfair Display',serif}</style>
</head>
<body class="bg-beige-50 text-gray-800">

  <nav class="bg-primary-900 text-white sticky top-0 z-50 shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-beige-300 flex items-center justify-center text-primary-900 font-display font-bold">H</div>
        <span class="font-display text-lg">Hasitha Furniture</span>
      </a>
      <a href="/" class="text-sm text-beige-200 hover:text-white">← Back to Home</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center mb-8">
      <p class="text-primary-700 text-sm tracking-[0.25em] uppercase mb-2">Full Collection</p>
      <h1 class="font-display text-3xl md:text-5xl text-primary-900">All Products</h1>
      <div class="w-20 h-1 bg-primary-700 mx-auto mt-4"></div>
    </div>

    <div class="max-w-xl mx-auto mb-12">
      <div class="relative">
        <input type="text" id="search" placeholder="Search all products..."
               class="w-full px-5 py-3 pl-12 rounded-full border border-primary-200 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white shadow-sm text-sm"
               oninput="doSearch(this.value)">
        <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <div id="content">
      <p class="text-center text-gray-500 py-10">Loading products...</p>
    </div>
  </main>

  <footer class="bg-primary-950 text-beige-300 py-8 mt-12 text-center text-sm">
    <a href="/" class="hover:text-white">Hasitha Furniture & Electronics</a> · Ragalkanda, Alawwa
  </footer>

  <script>
    var allProducts = [];

    var groups = [
      {
        title: 'Furniture',
        cats: ['Sofas','Beds','Wardrobes','Dining Tables','Dining Chairs','Dining Sets','Veranda Chairs','Office Furniture','Mattresses','Other Furniture']
      },
      {
        title: 'Electronics',
        cats: ['Televisions','Refrigerators','Washing Machines','Ovens','Blenders','Kettles & Irons','Pressure Washers','Fans','Vacuum Cleaners','Rice Cookers','Party Boxes','Sound Systems & Radios','Other Electronics']
      },
      {
        title: 'Plastic Items',
        cats: ['Plastic Items']
      },
      {
        title: 'Gift Items',
        cats: ['Gift Items']
      }
    ];

    function cardHtml(p) {
      var img = p.image
        ? '<img src="' + p.image + '" alt="' + (p.name||'') + '" class="w-full h-full object-cover">'
        : '<span class="text-5xl opacity-40">📦</span>';
      var disc = p.discount
        ? '<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">' + p.discount + '</span>'
        : '';
      var stockClass = p.stock === 'Out of Stock' ? 'text-red-600' : 'text-green-600';
      return '<a href="/product.html?id=' + p._i + '" class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition block">' +
        '<div class="h-48 bg-beige-200 flex items-center justify-center overflow-hidden">' + img + '</div>' +
        '<div class="p-5">' +
          '<p class="text-xs text-primary-600 uppercase tracking-wider mb-1">' + (p.category||'') + '</p>' +
          '<h3 class="font-display text-lg text-primary-900 mb-1">' + (p.name||'') + '</h3>' +
          '<div class="flex items-center gap-2">' +
            '<p class="font-semibold text-primary-800 text-sm">' + (p.price||'Price on request') + '</p>' + disc +
          '</div>' +
          '<p class="text-xs mt-1 ' + stockClass + '">' + (p.stock||'In Stock') + '</p>' +
        '</div></a>';
    }

    function render(list) {
      var html = '';
      var any = false;
      groups.forEach(function(g) {
        var items = list.filter(function(p) {
          return g.cats.some(function(c) {
            return (p.category||'').toLowerCase() === c.toLowerCase();
          });
        });
        if (!items.length) return;
        any = true;
        html += '<section class="mb-14">' +
          '<h2 class="font-display text-2xl md:text-3xl text-primary-900 mb-6">' + g.title + '</h2>' +
          '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">' +
          items.map(cardHtml).join('') +
          '</div></section>';
      });
      // orphan categories not in groups
      var known = {};
      groups.forEach(function(g){ g.cats.forEach(function(c){ known[c.toLowerCase()] = true; }); });
      var others = list.filter(function(p){ return !known[(p.category||'').toLowerCase()]; });
      if (others.length) {
        any = true;
        html += '<section class="mb-14">' +
          '<h2 class="font-display text-2xl md:text-3xl text-primary-900 mb-6">Other</h2>' +
          '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">' +
          others.map(cardHtml).join('') +
          '</div></section>';
      }
      document.getElementById('content').innerHTML = any
        ? html
        : '<p class="text-center text-gray-500 py-10">No products found.</p>';
    }

    function doSearch(q) {
      var query = (q||'').toLowerCase().trim();
      if (!query) { render(allProducts); return; }
      render(allProducts.filter(function(p) {
        return (p.name||'').toLowerCase().indexOf(query) !== -1 ||
               (p.description||'').toLowerCase().indexOf(query) !== -1 ||
               (p.category||'').toLowerCase().indexOf(query) !== -1;
      }));
    }

    async function load() {
      try {
        var res = await fetch('/data/products.json');
        var data = await res.json();
        allProducts = (data.products || []).filter(function(p){ return p.visible !== false && p.visible !== "false" && p.visible !== "No"; }).map(function(p, i) {
          return Object.assign({}, p, { _i: i });
        });
        render(allProducts);
      } catch (e) {
        document.getElementById('content').innerHTML =
          '<p class="text-center text-gray-500 py-10">Could not load products.</p>';
      }
    }
    load();
  </script>
</body>
</html>
