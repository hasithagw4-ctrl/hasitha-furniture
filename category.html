<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category | Hasitha Furniture & Electronics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
        tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#faf6f1',
              100: '#f0e8dc',
              200: '#e0d0bc',
              300: '#c9b090',
              400: '#a88b5c',
              500: '#8b6b3d',
              600: '#6f5430',
              700: '#574226',
              800: '#483720',
              900: '#3D2914',
              950: '#21160b'
            },
            beige: {
              50: '#faf8f5',
              100: '#F3EBE0',
              200: '#e8ddd0',
              300: '#d9c9b5',
              400: '#c4a97e',
              500: '#b8956a'
            }
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>body{font-family:Inter,sans-serif}.font-display{font-family:'Playfair Display',serif}</style>
</head>
<body class="bg-beige-50 text-gray-800">

  <nav class="bg-primary-900 text-white sticky top-0 z-50 shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-beige-300 flex items-center justify-center text-primary-900 font-display font-bold">H</div>
        <span class="font-display text-lg">Hasitha Furniture</span>
      </a>
      <a href="/" class="text-sm text-beige-200 hover:text-white">← Back to Home</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center mb-8">
      <p class="text-primary-700 text-sm tracking-[0.25em] uppercase mb-2">Category</p>
      <h1 id="cat-title" class="font-display text-3xl md:text-5xl text-primary-900">Loading...</h1>
      <div class="w-20 h-1 bg-primary-700 mx-auto mt-4"></div>
    </div>

    <div class="max-w-xl mx-auto mb-10">
      <div class="relative">
        <input type="text" id="cat-search" placeholder="Search in this category..."
               class="w-full px-5 py-3 pl-12 rounded-full border border-primary-200 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-white shadow-sm text-sm"
               oninput="filterLocal(this.value)">
        <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <div id="empty" class="hidden text-center py-16 text-gray-500">
      <p class="mb-4">No products in this category yet.</p>
      <a href="/" class="text-primary-700 underline">Back to home</a>
    </div>

    <div id="grid" class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5 md:gap-6"></div>
  </main>

  <footer class="bg-primary-950 text-beige-300 py-8 mt-12 text-center text-sm">
    <a href="/" class="hover:text-white">Hasitha Furniture & Electronics</a> · Ragalkanda, Alawwa
  </footer>

  <script>
    function getParam(n) {
      return new URLSearchParams(window.location.search).get(n);
    }

    var categoryProducts = [];

    function renderGrid(list) {
      var grid = document.getElementById('grid');
      var empty = document.getElementById('empty');
      if (!list.length) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        empty.querySelector('p').textContent = 'No products found.';
        return;
      }
      empty.classList.add('hidden');
      grid.innerHTML = list.map(function(p) {
        var img = p.image
          ? '<img src="' + p.image + '" alt="' + (p.name || '') + '" class="w-full h-full object-contain">'
          : '<span class="text-3xl sm:text-5xl opacity-40">📦</span>';
        var disc = p.discount ? '<span class="text-[10px] sm:text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded-full">' + p.discount + '</span>' : '';
        var stockClass = p.stock === 'Out of Stock' ? 'text-red-600' : 'text-green-600';
        return '<a href="/product.html?id=' + p._i + '" class="bg-white rounded-xl sm:rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition block">' +
          '<div class="aspect-square bg-beige-100 flex items-center justify-center overflow-hidden p-2">' + img + '</div>' +
          '<div class="p-2.5 sm:p-4">' +
            '<h3 class="font-display text-sm sm:text-lg text-primary-900 mb-1 line-clamp-2 leading-snug">' + (p.name || '') + '</h3>' +
            '<p class="font-semibold text-primary-800 text-sm sm:text-base">' + (p.price || 'Price on request') + '</p>' +
            (disc ? '<div class="mt-1">' + disc + '</div>' : '') +
          '</div></a>';
      }).join('');
    }

    function filterLocal(q) {
      var query = (q || '').toLowerCase().trim();
      if (!query) {
        renderGrid(categoryProducts);
        return;
      }
      var filtered = categoryProducts.filter(function(p) {
        var name = (p.name || '').toLowerCase();
        var desc = (p.description || '').toLowerCase();
        return name.indexOf(query) !== -1 || desc.indexOf(query) !== -1;
      });
      renderGrid(filtered);
    }

    async function load() {
      var cat = getParam('cat') || '';
      document.getElementById('cat-title').textContent = cat || 'All Products';
      document.title = (cat || 'Category') + ' | Hasitha Furniture';

      try {
        var res = await fetch('/data/products.json');
        var data = await res.json();
        var products = (data.products || []).filter(function(p){ return p.visible !== false && p.visible !== "false" && p.visible !== "No"; }).map(function(p, i) {
          return Object.assign({}, p, { _i: i });
        });
        categoryProducts = cat
          ? products.filter(function(p) {
              return (p.category || '').toLowerCase() === cat.toLowerCase();
            })
          : products;

        if (!categoryProducts.length) {
          document.getElementById('empty').classList.remove('hidden');
          return;
        }
        renderGrid(categoryProducts);
      } catch (e) {
        console.error(e);
        document.getElementById('empty').classList.remove('hidden');
        document.getElementById('empty').querySelector('p').textContent = 'Could not load products.';
      }
    }

    load();
  </script>
</body>
</html>
