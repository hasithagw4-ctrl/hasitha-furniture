<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category | Hasitha Furniture & Electronics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
    function getParam(n){ return new URLSearchParams(window.location.search).get(n); }
    let categoryProducts = [];

    function renderGrid(list) {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      if (!list.length) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        empty.querySelector('p').textContent = 'No products found.';
        return;
      }
      empty.classList.add('hidden');
      grid.innerHTML = list.map(p => `
          <a href="/product.html?id=${p._i}" class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition block">
            <div class="h-56 bg-beige-200 flex items-center justify-center overflow-hidden">
              ${p.image
                ? `<img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">`
                : `<span class="text-5xl opacity-40">📦</span>`}
            </div>
            <div class="p-6">
              <p class="text-xs text-primary-600 uppercase tracking-wider mb-1">${p.category || ''}</p>
              <h3 class="font-display text-xl text-primary-900 mb-2">${p.name}</h3>
              <p class="text-gray-600 text-sm mb-3 line-clamp-2">${p.description || ''}</p>
              <div class="flex items-center gap-2 mb-1">
                <p class="font-semibold text-primary-800">${p.price || 'Price on request'}</p>
                ${p.discount ? `<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">${p.discount}</span>` : ''}
              </div>
              <p class="text-xs ${p.stock === 'Out of Stock' ? 'text-red-600' : 'text-green-600'}">${p.stock || 'In Stock'}</p>
            </div>
          </a>
        `).join('');
    }

    function filterLocal(q) {
      const query = (q || '').toLowerCase().trim();
      if (!query) {
        renderGrid(categoryProducts);
        return;
      }
      const filtered = categoryProducts.filter(p => {
        const name = (p.name || '').toLowerCase();
        const desc = (p.description || '').toLowerCase();
        return name.includes(query) || desc.includes(query);
      });
      renderGrid(filtered);
    }

    async function load() {
      const cat = getParam('cat') || '';
      document.getElementById('cat-title').textContent = cat || 'All Products';
      document.title = (cat || 'Category') + ' | Hasitha Furniture';

      try {
        const res = await fetch('/data/products.json');
        const data = await res.json();
        const products = (data.products || []).map((p, i) => ({...p, _i: i}));
        categoryProducts = cat
          ? products.filter(p => (p.category || '').toLowerCase() === cat.toLowerCase())
          : products;

        if (!categoryProducts.length) {
          document.getElementById('empty').classList.remove('hidden');
          return;
        }

        renderGrid(categoryProducts);
      } catch (e) {
        console.error(e);
        document.getElementById('empty').classList.remove('hidden');
        document.getElementById('empty').querySelector('p').textContent = 'Could not load products.';
      }
    }
    load();
  </script>

</body>
</html>
