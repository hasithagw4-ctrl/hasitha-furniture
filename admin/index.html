<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hasitha Furniture Admin</title>
    <style>
      #hf-admin-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.45rem 0.85rem;
        background: #3d2914;
        color: #f3ebe0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 0.85rem;
        box-shadow: 0 2px 8px rgba(0,0,0,.2);
      }
      #hf-admin-bar a {
        color: #f3ebe0;
        text-decoration: none;
        font-weight: 600;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        border: 1px solid rgba(243,235,224,.35);
      }
      #hf-admin-bar a:hover {
        background: rgba(243,235,224,.12);
      }
      #hf-admin-bar .brand {
        opacity: 0.9;
        font-weight: 500;
      }
      /* push CMS below bar */
      body { padding-top: 42px !important; }
    </style>
  </head>
  <body>
    <div id="hf-admin-bar">
      <span class="brand">Hasitha Admin</span>
      <a href="/admin/bulk-price.html">Bulk Price Update</a>
    </div>
    <!-- Sveltia CMS: works with GitHub on Cloudflare (no Netlify Identity) -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
