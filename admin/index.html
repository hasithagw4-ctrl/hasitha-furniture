<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hasitha Furniture Admin</title>
    <style>
      #hf-admin-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.45rem 0.85rem;
        background: #3d2914;
        color: #f3ebe0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 0.85rem;
        box-shadow: 0 2px 8px rgba(0,0,0,.2);
      }
      #hf-admin-bar a {
        color: #f3ebe0;
        text-decoration: none;
        font-weight: 600;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        border: 1px solid rgba(243,235,224,.35);
      }
      #hf-admin-bar a:hover { background: rgba(243,235,224,.12); }
      #hf-admin-bar .brand { opacity: 0.9; font-weight: 500; }
      body { padding-top: 42px !important; }

      #hf-toast {
        position: fixed;
        top: 56px;
        right: 16px;
        z-index: 100000;
        max-width: min(360px, calc(100vw - 24px));
        padding: 0.85rem 1.1rem;
        border-radius: 12px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(0,0,0,.25);
        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
        transition: opacity .25s ease, transform .25s ease;
      }
      #hf-toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
      #hf-toast.ok { background: #166534; color: #ecfdf5; }
      #hf-toast.err { background: #991b1b; color: #fef2f2; }

      /* Make Sveltia save control look like a clear Publish button */
      button[aria-label*="Publish" i],
      button[aria-label*="Save" i],
      button[title*="Publish" i],
      button[title*="Save" i],
      .hf-publish-btn {
        min-width: 120px !important;
        height: auto !important;
        padding: 0.55rem 1.1rem !important;
        border-radius: 8px !important;
        background: #2563eb !important;
        color: #fff !important;
        font-weight: 700 !important;
        font-size: 0.9rem !important;
        border: none !important;
        box-shadow: 0 2px 8px rgba(37,99,235,.35) !important;
        gap: 0.35rem !important;
      }
      button[aria-label*="Publish" i]:hover,
      button[aria-label*="Save" i]:hover,
      .hf-publish-btn:hover {
        background: #1d4ed8 !important;
      }
    </style>
  </head>
  <body>
    <div id="hf-admin-bar">
      <span class="brand">Hasitha Admin</span>
      <a href="/admin/bulk-price.html">Bulk Price Update</a>
    </div>
    <div id="hf-toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        var toastEl = document.getElementById('hf-toast');
        var hideTimer = null;

        function showToast(message, type) {
          toastEl.textContent = message;
          toastEl.className = 'show ' + (type || 'ok');
          clearTimeout(hideTimer);
          hideTimer = setTimeout(function () {
            toastEl.className = '';
          }, 4000);
        }

        var originalFetch = window.fetch;
        window.fetch = function () {
          var args = arguments;
          var url = '';
          try {
            if (typeof args[0] === 'string') url = args[0];
            else if (args[0] && args[0].url) url = args[0].url;
          } catch (e) {}

          var method = 'GET';
          try {
            if (args[1] && args[1].method) method = String(args[1].method).toUpperCase();
            else if (args[0] && args[0].method) method = String(args[0].method).toUpperCase();
          } catch (e) {}

          var isGithubWrite =
            /api\.github\.com/i.test(url) &&
            (method === 'PUT' || method === 'POST' || method === 'PATCH' || method === 'DELETE');

          return originalFetch.apply(this, args).then(function (response) {
            if (isGithubWrite) {
              if (response.ok) {
                showToast('✓ Saved successfully — publishing to site…', 'ok');
              } else if (response.status === 401 || response.status === 403) {
                showToast('Save failed — GitHub login/token expired. Log out and sign in again.', 'err');
              } else if (response.status >= 400) {
                showToast('Save failed (error ' + response.status + ')', 'err');
              }
            }
            return response;
          }).catch(function (err) {
            if (isGithubWrite) showToast('Save failed — network error', 'err');
            throw err;
          });
        };

        // Label / enlarge the Sveltia save control so it looks like old Publish button
        function enhancePublishButtons() {
          var buttons = document.querySelectorAll('button');
          buttons.forEach(function (b) {
            var label = (
              (b.getAttribute('aria-label') || '') + ' ' +
              (b.getAttribute('title') || '') + ' ' +
              (b.textContent || '')
            ).toLowerCase();
            if (!/(publish|save entry|save)/.test(label)) return;
            if (b.dataset.hfEnhanced) return;
            b.dataset.hfEnhanced = '1';
            b.classList.add('hf-publish-btn');
            if (!/publish|save/i.test(b.textContent || '')) {
              var span = document.createElement('span');
              span.textContent = ' Publish';
              span.style.marginLeft = '4px';
              b.appendChild(span);
            }
          });
        }

        setInterval(enhancePublishButtons, 800);
        setTimeout(enhancePublishButtons, 1500);
      })();
    </script>

    <!-- Sveltia CMS (GitHub PAT login — clear Publish styling added above) -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
