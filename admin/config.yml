backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "products"
        label: "All Products"
        file: "data/products.json"
        fields:
          - label: "Products List"
            name: "products"
            widget: "list"
            fields:
              - { label: "Product Name", name: "name", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["Sofas", "Beds", "Wardrobes", "Dining Sets", "Veranda Chairs", "Office Furniture", "Televisions", "Refrigerators", "Washing Machines", "Ovens", "Blenders", "Kettles & Irons", "Pressure Washers", "Plastic Items"] }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price", name: "price", widget: "string", default: "Price on request" }
              - { label: "Discount", name: "discount", widget: "string", required: false, hint: "Example: 10% OFF or Rs. 5000 OFF" }
              - { label: "Stock Status", name: "stock", widget: "select", options: ["In Stock", "Out of Stock"], default: "In Stock" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "WhatsApp Message", name: "whatsapp", widget: "string", default: "Hi, I'm interested in this product" }
